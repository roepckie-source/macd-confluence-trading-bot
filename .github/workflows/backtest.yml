
name: Historical BTC Backtest V2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run strategy self-test
        run: python strategy.py

      - name: Run six-month V2 analysis
        run: python backtest_v2.py

      - name: Upload V2 analysis results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-backtest-v2-results
          path: |
            backtest_v2_trades.csv
            backtest_v2_equity.csv
            backtest_v2_scores.csv
            backtest_v2_summary.txt
          if-no-files-found: warn
          retention-days: 30
