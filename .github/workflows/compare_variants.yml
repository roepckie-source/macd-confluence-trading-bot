name: Compare Trading Variants

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run strategy self-test
        run: python strategy.py

      - name: Compare all three variants
        run: python compare_variants.py

      - name: Upload comparison results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-variant-comparison
          path: |
            variant_comparison.csv
            variant_trades.csv
          if-no-files-found: warn
          retention-days: 30